# Pandablog reverse-proxy vhost for production (domain-based, TLS).
# Place in your nginx conf.d / sites directory and reload nginx.
#
# Assumes nginx and pandablog-app share the external "nginx" docker network,
# so nginx can resolve the upstream by container name.
# Include access-log-format.conf in nginx's http context BEFORE this vhost.
# Persist /var/log/nginx on the proxy host/mount, configure rotation/reopen,
# and use UTC for the proxy process timezone. See logging operations.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name blog.example.com;            # <-- replace with your domain
    access_log /var/log/nginx/pandablog.access.log pandablog_json;

    # Allow ACME HTTP-01 challenges if you use certbot/webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.example.com;            # <-- replace with your domain
    access_log /var/log/nginx/pandablog.access.log pandablog_json;

    ssl_certificate     /etc/nginx/certs/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/blog.example.com/privkey.pem;

    # Reasonable modern TLS defaults.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads / media. Pandablog allows large media; keep this generous.
    client_max_body_size 100M;

    # Compress first-visit payloads. Nuxt/Nitro serves pre-compressed public
    # assets when available; nginx gzip covers dynamic SSR HTML and JSON.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-javascript
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        proxy_pass http://pandablog-app:3000;

        proxy_http_version 1.1;

        # Host + protocol so Nuxt builds correct absolute URLs and sets
        # Secure cookies (admin sessions require this over HTTPS).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SECURITY: overwrite (do NOT append) the client IP. This is the real
        # socket address nginx sees and is what powers per-IP login rate
        # limiting and analytics. Using $remote_addr here strips any
        # spoofed inbound X-Forwarded-For from clients.
        # Only switch to $proxy_add_x_forwarded_for if there is ANOTHER
        # trusted proxy in front of this nginx.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_read_timeout 86400;
    }
}

services:
  app:
    image: ${PANDABLOG_IMAGE:-pandablog-single:latest}
    # Match the UID:GID that OWNS the bind-mounted ./app-storage directory on
    # the host. This is important to ensure that the container can read/write to this volume.
    # the deploy user is most likely 1000. Adjust if different.
    user: "1000:1000"
    pull_policy: never
    container_name: pandablog-app
    # Deployment guarantees ONE app instance: stop/remove before replacement,
    # never rolling overlap. Ordinary restart needs no writer receipt/hostname.
    restart: unless-stopped
    # Allow HTTP/DB drain and actual restore checkpoints (Nitro 15s, coordinator
    # 10s). Forced ordinary exit restarts normally; unresolved destructive restore
    # preserves its journal and paired safety/media state for offline recovery.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    expose:
      - 3000
    volumes:
      - ./app-storage:/app/storage
    networks:
      - nginx
    healthcheck:
      # Readiness, not just liveness: /api/health returns 200 even while startup
      # is fenced or the database is unreachable (and is being retried).
      test: ["CMD", "panda", "health", "--url", "http://127.0.0.1:3000/api/ready", "--timeout", "4"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  nginx:
    external: true
